services:

  # =====================
  # HADOOP
  # =====================

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=hadoop-lab
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode
    volumes:
      - datanode:/hadoop/dfs/data

  # =====================
  # HIVE
  # =====================

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    environment:
      - SERVICE_NAME=metastore
    ports:
      - "9083:9083"

  hive-server:
    image: apache/hive:3.1.3
    container_name: hive-server
    depends_on:
      - hive-metastore
    environment:
      - SERVICE_NAME=hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./data:/data
      - ./hive_warehouse:/opt/hive/warehouse

  hive-init:
    image: apache/hive:3.1.3

    depends_on:
      - hive-server

    volumes:
      - ./hive:/scripts
      - ./data:/data

    entrypoint: ["/bin/bash", "/scripts/init-hive.sh"]

  # =====================
  # KAFKA
  # =====================

  zookeeper:
    image: zookeeper:3.9.2
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka1:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka1

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka1
    ports:
      - "9002:8080"
    environment:

      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092

      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka-init:
    image: confluentinc/cp-kafka:7.5.1

    depends_on:
      - kafka1

    volumes:
      - ./kafka:/scripts

    command: >
      bash -c "
        bash /scripts/create-topics.sh
      "

  # =====================
  # MONGODB
  # =====================

  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${ME_CONFIG_MONGODB_ADMINUSERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${ME_CONFIG_MONGODB_ADMINPASSWORD}
      - ME_CONFIG_MONGODB_URL=${ME_CONFIG_MONGODB_URL}
      - ME_CONFIG_BASICAUTH=false

  steam-playtime-producer:
    build:
      context: ./producers/steam-playtime-producer

    container_name: steam-playtime-producer

    depends_on:
      - kafka1

    environment:
      API_KEY: ${API_KEY}
      STEAM_ID: ${STEAM_ID}
      KAFKA_BOOTSTRAP: kafka1:9092
      INTERVAL_SECONDS: 300

    restart: unless-stopped

  steam-games-producer:
    build:
      context: ./producers/steam-games-producer

    container_name: steam-games-producer

    depends_on:
      - kafka1
      - mongo

    environment:
      KAFKA_BOOTSTRAP: kafka1:9092

      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/

      MONGO_DATABASE: steam

      MONGO_COLLECTION: playtime

      INTERVAL_SECONDS: 86400

    restart: unless-stopped


  mongo-consumer:
    build:
      context: ./consumers/mongo-consumer

    container_name: mongo-consumer

    depends_on:
      - kafka1
      - mongo

    environment:
      KAFKA_BOOTSTRAP: kafka1:9092

      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/

      MONGO_DATABASE: steam

      MONGO_COLLECTION: playtime

    restart: unless-stopped

  hive-consumer:
    build:
      context: ./consumers/hive-consumer

    container_name: hive-consumer

    depends_on:
      - kafka1
      - hive-server

    environment:
      KAFKA_BOOTSTRAP: kafka1:9092
      HIVE_HOST: hive-server
      HIVE_PORT: 10000
      HIVE_DATABASE: steam

    restart: unless-stopped


volumes:
  namenode:
  datanode: